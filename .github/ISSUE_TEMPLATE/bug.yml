name: Bug report
description: Something in the desktop companion is broken
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15, Windows 11, …
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Screenshots or what the companion showed. Do not paste a raw Arena log file.
